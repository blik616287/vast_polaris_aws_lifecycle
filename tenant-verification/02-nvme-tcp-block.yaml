# ─────────────────────────────────────────────────────────────────────────────
# VAST NVMe/TCP block verification  (StorageClass: vastdata-block)
#
# Proves: the vast-block driver on THIS cluster provisions a raw block volume,
# connects it over NVMe/TCP (transport_type=TCP) to the tenant's VIP pool,
# formats+mounts it (ext4), and can read+write it.
#
# Tenant scoping is automatic (the vastdata-block StorageClass on each cluster
# carries that tenant's subsystem + vip_pool), so NO edits are needed.
#
# NOTE: requires the node's nvme-tcp kernel module + nvme-cli (the cluster
# profile installs these via a preKubeadm step). If the pod stays in
# ContainerCreating with a "connect" error, that prereq is missing on the node.
#
#   kubectl apply -f 02-nvme-tcp-block.yaml
#   kubectl wait --for=condition=complete job/verify-block -n default --timeout=240s
#   kubectl logs -n default job/verify-block      # look for "NVME/TCP VERIFY: PASS"
#   kubectl delete -f 02-nvme-tcp-block.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verify-block
  namespace: default
  labels: {vast-verify: block}
spec:
  accessModes: [ReadWriteOnce]           # block = RWO
  storageClassName: vastdata-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-block
  namespace: default
  labels: {vast-verify: block}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {vast-verify: block}
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo "device mounted over NVMe/TCP:"; df -h /data | tail -1
              mount | grep /data || true
              TOKEN="block-$(cat /proc/sys/kernel/random/uuid)"
              echo "$TOKEN" > /data/proof.txt
              sync
              GOT="$(cat /data/proof.txt)"
              echo "wrote:  $TOKEN"
              echo "readback: $GOT"
              [ "$TOKEN" = "$GOT" ] || { echo "NVME/TCP VERIFY: FAIL (mismatch)"; exit 1; }
              echo "NVME/TCP VERIFY: PASS"
          volumeMounts:
            - {name: vol, mountPath: /data}
      volumes:
        - name: vol
          persistentVolumeClaim:
            claimName: verify-block
